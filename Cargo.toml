[package]
name = "agent-authz-bench"
description = "The same attacks and timings run against several agent authorization formats"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
rust-version = "1.90"
repository = "https://github.com/ekayana-labs/agent-authz-bench"
publish = false

[[bin]]
name = "authz-bench"
path = "src/main.rs"

[dependencies]
biscuit-auth = "=6.0.0"
chrono = "0.4"
ciborium = "0.2"
pq-ucan = { version = "=0.1.2", features = ["ml-dsa"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tenuo = "=0.3.5"
